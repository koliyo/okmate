<!DOCTYPE html>
<html lang="en"{% if html_style != "" %} style="{{ html_style }}"{% endif %}{% if !reading_wrap %} data-okmate-wrap="off"{% endif %}{% if !reading_nav %} data-okmate-nav="off"{% endif %}{% if !reading_toc %} data-okmate-toc="off"{% endif %}{% if main_scroll > 0 %} data-okmate-main-scroll="{{ main_scroll }}"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/__okmate/app.css">
    <script type="module" src="/__okmate/datastar.js"></script>
    <script src="/__okmate/goto.js" defer></script>
    <script src="/__okmate/nav.js" defer></script>
    <script src="/__okmate/resize.js" defer></script>
    <script src="/__okmate/tables.js" defer></script>
    <script src="/__okmate/reading.js" defer></script>
    <script src="/__okmate/toc.js" defer></script>
    <script src="/__okmate/review.js" defer></script>
    <script src="/__okmate/log.js" defer></script>
  </head>
  <body>
    <div class="okmate-shell">
      <div class="okmate-chrome" id="okmate-nav">
        {% include "nav.html" %}
      </div>
      <main id="okmate-main">
        {% block main %}{% endblock %}
      </main>
      {% include "toc.html" %}
    </div>
    {% include "toolbar.html" %}
    <dialog id="okmate-goto" class="okmate-goto" aria-label="Go to page">
      <input id="okmate-goto-input" type="search" placeholder="Go to page" autocomplete="off">
      <ul id="okmate-goto-list"></ul>
    </dialog>
  </body>
</html>
