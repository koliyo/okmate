name: Knowledge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knowledge:
    name: Validate Knowledge OKF Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Check knowledge bundle
        run: uv run --no-dev okmate-ops ci knowledge
