name: Site

on:
  push:
    branches: [main, website]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROC_NIGHTLY_DATE: "2026-09-03"
  ROC_NIGHTLY_SHA: 62fcb65

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 librsvg2-2 libsqlite3-0
      - name: Install newest released rocdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="$HOME/.local/rocci-release"
          link_dir="$HOME/.local/bin"
          mkdir -p "$dest" "$link_dir"
          tag="$(gh release view --repo koliyo/rocci --json tagName --jq .tagName)"
          gh release download --repo koliyo/rocci "$tag" \
            --pattern 'rocci-*-x86_64-unknown-linux-gnu.tar.gz' \
            --dir "$dest"
          tar -xzf "$dest"/rocci-*-x86_64-unknown-linux-gnu.tar.gz -C "$dest"
          rocdown_bin="$(find "$dest" -type f -name rocdown | head -n 1)"
          test -n "$rocdown_bin"
          chmod +x "$rocdown_bin"
          ln -sf "$rocdown_bin" "$link_dir/rocdown"
          echo "$link_dir" >> "$GITHUB_PATH"
          echo "Installed rocdown from koliyo/rocci $tag"
      - name: Install pinned Roc nightly
        run: |
          set -euo pipefail
          prefix="$HOME/.local/roc"
          link_dir="$HOME/.local/bin"
          mkdir -p "$prefix" "$link_dir"
          tag="nightly-${ROC_NIGHTLY_DATE}-${ROC_NIGHTLY_SHA}"
          archive="roc_nightly-linux_x86_64-${ROC_NIGHTLY_DATE}-${ROC_NIGHTLY_SHA}.tar.gz"
          url="https://github.com/roc-lang/nightlies/releases/download/${tag}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/roc.tar.gz"
          tar -xzf "$tmp/roc.tar.gz" -C "$tmp"
          roc_bin="$(find "$tmp" -type f -name roc | head -n 1)"
          cp -a "$(dirname "$roc_bin")/." "$prefix/"
          ln -sf "$prefix/roc" "$link_dir/roc"
          echo "$link_dir" >> "$GITHUB_PATH"
          "$link_dir/roc" version
      - name: Check and build site
        run: |
          rocdown check site
          rocdown build site --output dist/site
          cp site/llms.txt dist/site/llms.txt
          test -f dist/site/llms.txt
          test -d dist/site/agents
