name: Site

on:
  push:
    branches: [main, website]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Pinned rocci revision that provides `rocdown` (rocci-rocdown-cli).
  ROCCI_REV: c1a28910fac72cfc14a84d60cfb2d4bbc3e6243b
  ROC_NIGHTLY_DATE: "2026-08-23"
  ROC_NIGHTLY_SHA: fb208ba

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned rocci
        uses: actions/checkout@v7
        with:
          repository: koliyo/rocci
          ref: ${{ env.ROCCI_REV }}
          path: .ci/rocci
      - name: Checkout h35-desktop sibling
        run: git clone --depth 1 https://github.com/koliyo/h35-desktop.git "${GITHUB_WORKSPACE}/.ci/h35-desktop"
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/rocci
      - name: Install pinned Roc nightly
        run: |
          set -euo pipefail
          prefix="$HOME/.local/roc"
          link_dir="$HOME/.local/bin"
          mkdir -p "$prefix" "$link_dir"
          tag="nightly-${ROC_NIGHTLY_DATE}-${ROC_NIGHTLY_SHA}"
          archive="roc_nightly-linux_x86_64-${ROC_NIGHTLY_DATE}-${ROC_NIGHTLY_SHA}.tar.gz"
          url="https://github.com/roc-lang/nightlies/releases/download/${tag}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/roc.tar.gz"
          tar -xzf "$tmp/roc.tar.gz" -C "$tmp"
          roc_bin="$(find "$tmp" -type f -name roc | head -n 1)"
          cp -a "$(dirname "$roc_bin")/." "$prefix/"
          ln -sf "$prefix/roc" "$link_dir/roc"
          echo "$link_dir" >> "$GITHUB_PATH"
          "$link_dir/roc" version
      - name: Build pinned rocdown
        run: |
          cargo build -q --release -p rocci-rocdown-cli --manifest-path .ci/rocci/Cargo.toml
          echo "${GITHUB_WORKSPACE}/.ci/rocci/target/release" >> "$GITHUB_PATH"
      - name: Check and build site
        run: |
          rocdown check site
          rocdown build site --output dist/site
          python3 site/gh-pages-prefix.py dist/site
          touch dist/site/.nojekyll
          test -f dist/site/llms.txt
          test -d dist/site/agents
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/website')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
