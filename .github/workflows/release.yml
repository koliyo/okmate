name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to rebuild (vX.Y.Z or dev)
        required: true
        type: string
  push:
    tags:
      - "v*"
      - "dev"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    name: macOS appcast
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Checkout h35-desktop sibling
        run: git clone --depth 1 https://github.com/koliyo/h35-desktop.git "${GITHUB_WORKSPACE}/../h35-desktop"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Assemble OKMate.app
        run: uv run --no-dev okmate-ops package desktop
      - name: Sign and notarize
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: uv run --no-dev okmate-ops package sign dist/OKMate.app
      - name: Zip archive and generate appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          mkdir -p dist/inbox
          ditto -c -k --keepParent dist/OKMate.app dist/inbox/OKMate.zip
          uv run --no-dev okmate-ops package appcast \
            dist/inbox \
            "https://github.com/koliyo/okmate/releases/download/${tag}/"
      - name: Attach archive and appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          if [[ "$tag" == "dev" ]]; then
            gh release create "$tag" dist/inbox/OKMate.zip dist/inbox/appcast.xml \
              --verify-tag \
              --title "$tag" \
              --notes "OKMate $tag" \
              --prerelease
          else
            gh release create "$tag" dist/inbox/OKMate.zip dist/inbox/appcast.xml \
              --verify-tag \
              --title "$tag" \
              --notes "OKMate $tag"
          fi
