name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS appcast
    if: github.ref_name != 'dev'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assemble Okmate.app
        run: packaging/macos/package.sh
      - name: Zip archive and generate appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          mkdir -p dist/inbox
          ditto -c -k --keepParent dist/Okmate.app dist/inbox/Okmate.zip
          framework=$(packaging/macos/fetch-sparkle.sh)
          export GENERATE_APPCAST=$(dirname "$framework")/bin/generate_appcast
          packaging/macos/generate-appcast.sh \
            dist/inbox \
            "https://github.com/koliyo/okmate/releases/download/${tag}/"
      - name: Attach archive and appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/inbox/Okmate.zip dist/inbox/appcast.xml --clobber
          else
            gh release create "$tag" dist/inbox/Okmate.zip dist/inbox/appcast.xml \
              --verify-tag \
              --title "$tag" \
              --notes "Okmate $tag"
          fi
