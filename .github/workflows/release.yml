name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS appcast
    if: github.ref_name != 'dev'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout h35-desktop sibling
        run: git clone --depth 1 https://github.com/koliyo/h35-desktop.git "${GITHUB_WORKSPACE}/../h35-desktop"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Assemble Okmate.app
        run: uv run --no-dev okmate-ops package desktop
      - name: Sign and notarize
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: uv run --no-dev okmate-ops package sign dist/Okmate.app
      - name: Zip archive and generate appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          mkdir -p dist/inbox
          ditto -c -k --keepParent dist/Okmate.app dist/inbox/Okmate.zip
          uv run --no-dev okmate-ops package appcast \
            dist/inbox \
            "https://github.com/koliyo/okmate/releases/download/${tag}/"
      - name: Attach archive and appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/inbox/Okmate.zip dist/inbox/appcast.xml --clobber
          else
            gh release create "$tag" dist/inbox/Okmate.zip dist/inbox/appcast.xml \
              --verify-tag \
              --title "$tag" \
              --notes "Okmate $tag"
          fi
