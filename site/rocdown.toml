[site]
title = "OKMate"
description = "OKMate is an open-source OKF knowledge tool."
language = "en"
repository = "https://github.com/koliyo/okmate"
social_image = "/assets/og.png"
favicon = "/assets/favicon.svg"
apple_touch_icon = "/assets/apple-touch-icon.png"
subtitle = "Git-owned OKF knowledge for humans and agents"
footer = "Experimental software — not a production-ready platform."

[build]
output = "../dist/site"
assets = "assets"

[snippets]
roots = ["../.agents/skills/manage-okmate-knowledge"]

