[package]
name = "okmate"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Okmate — open knowledge mate for OKF bundles"

[[bin]]
name = "okmate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
askama = "0.16"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
notify = "8"
okf = { git = "https://github.com/koliyo/rocci", package = "okf" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.6", features = ["fs"] }
datastar = { version = "0.4", features = ["axum"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tao = "0.36"
wry = { version = "0.56", features = ["devtools"] }
rfd = "0.15"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
