[workspace]
resolver = "2"
members = ["okf"]

[workspace.package]
version = "0.3.4"
edition = "2024"
license-file = "LICENSE"

[package]
name = "okmate"
version = "0.3.4"
edition = "2024"
license-file = "LICENSE"
description = "OKMate — open knowledge mate for OKF bundles"

[[bin]]
name = "okmate"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:h35-desktop"]

[dependencies]
anyhow = "1.0"
askama = "0.16"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
notify = "8"
okf = { path = "okf" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.6", features = ["fs"] }
datastar = { version = "0.4", features = ["axum"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
h35-desktop = { git = "https://github.com/koliyo/h35-desktop", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.comrak]
opt-level = 3

[profile.dev.package.okf]
opt-level = 3

[profile.dev.package.yaml-rust]
opt-level = 3

[profile.dev.package.unicode-normalization]
opt-level = 3

[profile.dev.package.finl_unicode]
opt-level = 3

[profile.dev.package.syntect]
opt-level = 3
