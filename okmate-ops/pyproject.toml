[project]
name = "okmate-ops"
version = "0.1.0"
description = "CI and maintainer commands for the Okmate repository."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
okmate-ops = "okmate_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okmate_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
