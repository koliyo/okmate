[package]
name = "okf"
version = "0.1.10"
edition = "2024"
license-file = "../LICENSE"
description = "Portable Open Knowledge Format (OKF) parsing, validation, search, graph, and artifact engine"

[lib]
name = "okf"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
comrak = { version = "0.54", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
toml = "1.1"
yaml-rust = "0.4"
