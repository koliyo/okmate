<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 192" role="img" aria-labelledby="title desc">
  <title id="title">OKMate logo</title>
  <desc id="desc">The OKMate wordmark beside two interlocking rings with a shared orange centre.</desc>
  <defs>
    <clipPath id="overlap">
      <circle cx="72" cy="96" r="48"/>
      <circle cx="120" cy="96" r="48"/>
    </clipPath>
  </defs>
  <rect width="192" height="192" rx="42" fill="#f8fffb"/>
  <rect width="192" height="192" fill="#E64B2F" clip-path="url(#overlap)"/>
  <circle cx="72" cy="96" r="48" fill="none" stroke="#242424" stroke-width="15"/>
  <circle cx="120" cy="96" r="48" fill="none" stroke="#242424" stroke-width="15"/>
  <text x="232" y="119" fill="#242424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="700" letter-spacing="-4">OKMate</text>
</svg>
